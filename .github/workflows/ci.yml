name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # has Docker, which the CDK synth test needs to bundle a construct asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # jsii (CDK for Python) runs on Node
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
